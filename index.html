<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuaderno del Cuerpo Técnico</title>
<meta name="description" content="Registro compartido del cuerpo técnico: plantel, entrenamientos, tests, lesiones, rutinas y partidos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuaderno">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#163C84" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#122F69" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: banda azul del club con el escudo, pestañas fijas, listas operativas debajo */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --sunk:#E6EAF2; --ink:#141B2B; --muted:#586379; --line:#D4DAE6;
  --accent:#163C84; --accent-ink:#FFFFFF; --accent-soft:#DDE5F5;
  --brand:#163C84; --brand-ink:#FFFFFF; --brand-muted:rgba(255,255,255,.74); --brand-hover:rgba(255,255,255,.14);
  --ok:#2C7A4C; --ok-soft:#DDEFE3; --warn:#C2410C; --warn-soft:#FBE4D8; --amber:#9A6510; --amber-soft:#F6EBCF;
  --shadow:0 10px 30px rgba(20,35,25,.18);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C111D; --surface:#131A2A; --sunk:#1A2337; --ink:#E6EBF4; --muted:#93A0B8; --line:#25304A;
  --accent:#7EA6FF; --accent-ink:#0B1020; --accent-soft:#1C2A4D;
  --brand:#122F69; --brand-ink:#FFFFFF; --brand-muted:rgba(255,255,255,.7); --brand-hover:rgba(255,255,255,.12);
  --ok:#62C38F; --ok-soft:#1C3527; --warn:#F28C55; --warn-soft:#3A2116; --amber:#E2B456; --amber-soft:#382C14;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* evita el zoom automático en iPhone */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Cabecera */
.top{background:var(--brand);color:var(--brand-ink)}
.top .wrap{padding-block:16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.club{min-width:0;display:flex;align-items:center;gap:14px}
.club>div{min-width:0}
.crest{width:60px;height:60px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
@media (max-width:480px){.crest{width:48px;height:48px}}
.top .eyebrow{color:var(--brand-muted)}
.top .who{color:var(--brand-muted)}
.top .btn.ghost{color:var(--brand-muted)}
.top .btn.ghost:hover{color:var(--brand-ink);background:var(--brand-hover)}
.top .pill.ok{background:var(--brand-hover);color:var(--brand-ink)}
.crest-lg{width:96px;height:96px;justify-self:center;filter:drop-shadow(0 4px 10px rgba(10,30,70,.25))}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.club h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,42px);line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* Pestañas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;flex-wrap:wrap;gap:0 2px}
.menu-btn{display:none;width:100%;border:0;background:none;cursor:pointer;justify-content:space-between;align-items:center;gap:10px;padding-block:13px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent)}
.menu-btn .mb{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-body);font-size:14px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.menu-btn .bars{display:grid;gap:3px}
.menu-btn .bars i{display:block;width:16px;height:2px;border-radius:2px;background:currentColor}
@media (max-width:820px){
  .menu-btn{display:flex}
  .tabs .wrap{display:none}
  .tabs.open{box-shadow:var(--shadow);max-height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto}
  .tabs.open .wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:14px}
  .tabs.open .tab{border:1px solid var(--line);border-radius:10px;padding:12px 10px;font-size:15px;min-width:0;justify-content:space-between;white-space:normal;text-align:left}
  .tabs.open .tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent)}
}
.tab{border:0;background:none;padding:12px 12px 10px;font-family:var(--f-display);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .c{font-family:var(--f-mono);font-size:11px;background:var(--sunk);color:var(--muted);padding:1px 6px;border-radius:6px}

main .wrap{padding-block:20px 60px;display:grid;gap:18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar h2{margin:0;font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.bar p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--warn)}
.btn.armed{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.block{width:100%;padding:11px 14px;font-size:15px}
select.flt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px}

/* Resumen */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;min-width:0}
.stat .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--muted)}
.stat .v.warn{color:var(--warn)}
@media (max-width:680px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel>h3,.cx-panel>summary>h3,.g-help>summary>h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel>h3 small,.cx-panel>summary>h3 small,.g-help>summary>h3 small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted);font-weight:500}
.panel .body{padding:14px 16px}
.match-card{display:grid;gap:4px}
.col{display:grid;gap:18px;min-width:0}
.panel.today{border-color:var(--accent);margin-bottom:18px}
.today .body{display:grid;gap:6px}
.today-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.today-t{font-family:var(--f-display);font-size:28px;font-weight:700;text-transform:uppercase;line-height:1.05}
.today-g{color:var(--muted);font-size:15px}
.today-m{font-size:14px}
.today-bd{font-size:14px;padding:8px 12px;border-radius:10px;background:var(--accent-soft)}
.today-s{display:grid;gap:8px;padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.today .tools{margin-top:6px}
.pend{display:grid;gap:0}
.pend-it{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.pend-it:first-child{border-top:0;padding-top:0}
.pend-t{flex:1;min-width:200px}
.pend details,.miss{margin-top:6px}
.pend summary,.miss summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
.wavg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wavg>div{border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:grid;gap:2px}
.wavg .k{font-size:12px;color:var(--muted);font-weight:600}
.wavg b{font-size:20px}.wavg b.lo{color:var(--warn)}
@media (max-width:420px){.wavg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;height:150px;align-items:end}
.wk-c{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;text-align:center;gap:4px;min-width:0}
.wk-f{display:block;background:var(--accent-soft);border-radius:6px 6px 0 0;min-height:2px}
.wk-c.cur .wk-f{background:var(--accent)}
.wk-n{font-size:12px;white-space:nowrap}
.wk-l{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:4px}
.match-card .rival{font-family:var(--f-display);font-size:28px;font-weight:700;text-transform:uppercase;line-height:1.05}

/* Listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;gap:4px 14px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row.click{cursor:pointer}
.row.click:hover{background:var(--sunk)}
.row .main{min-width:0}
.row .t{font-weight:600}
.row .m{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px}
.row .acts{display:flex;gap:4px;justify-content:flex-end}
.r-player{grid-template-columns:52px minmax(0,1fr) auto}
.r-player .dorsal{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;text-align:center;color:var(--accent)}
.r-std{grid-template-columns:76px minmax(0,1fr) auto}
.r-mail{grid-template-columns:minmax(0,1fr) auto}
.date{font-family:var(--f-mono);font-size:13px;line-height:1.25;color:var(--muted)}
.date b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);font-weight:700;letter-spacing:.02em}
.figs{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end}
.fig{text-align:right}
.fig .n{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.fig .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.notes{grid-column:2/-1;font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:560px){
  .r-player{grid-template-columns:44px minmax(0,1fr) auto}
  .r-player .acts{grid-column:2/-1;justify-content:flex-start}
  .r-std{grid-template-columns:60px minmax(0,1fr)}
  .r-std .side{grid-column:2/-1}
  .figs{justify-content:flex-start}.fig{text-align:left}
  .notes{grid-column:1/-1}
}
.score{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.rcard h4{margin:0;font-family:var(--f-display);font-size:21px;text-transform:uppercase;line-height:1.1}
.rcard ol{margin:0;padding-left:20px;display:grid;gap:3px;font-size:14px}
.rcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--muted)}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 14px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.r,th.r{text-align:right}
td .rk{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--accent)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.empty p{margin:0;max-width:46ch}

.feed{display:grid}
.feed .it{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:start}
.feed .it:first-child{border-top:0;padding-top:0}
.feed .av{width:26px;height:26px;font-size:10px}
.feed .when{color:var(--muted);font-size:12px}

.banner{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--amber-soft);color:var(--amber)}

/* Modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,18,14,.45);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
@media (min-width:700px){.modal{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
@media (min-width:700px){.sheet{border-radius:16px;max-height:88vh}}
.sheet header{position:sticky;top:0;background:var(--surface);padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:1}
.sheet header h3{margin:0;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.sheet .content{padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:grid;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.fld label,.fld .lb{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.fld textarea{min-height:96px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 4px;border-radius:6px;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
.checks label:hover{background:var(--sunk)}
.checks .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:20px}
.formacts{display:flex;justify-content:flex-end;gap:8px;grid-column:1/-1;padding-top:4px;flex-wrap:wrap}

.det-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.det-head .dorsal{font-family:var(--f-display);font-size:56px;font-weight:700;color:var(--accent);line-height:1}
.det-head{grid-template-columns:auto auto minmax(0,1fr)}
.det-ph{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-soft)}
.det-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.det-kpi>div{border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;gap:2px;min-width:0}
.det-kpi .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.det-kpi b{font-family:var(--f-display);font-size:22px;line-height:1.1}
.det-kpi .s{font-size:12px;color:var(--muted)}
@media (max-width:560px){.det-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trend{font-size:12px;font-weight:600;margin-left:6px;white-space:nowrap}.trend.up{color:var(--ok)}.trend.down{color:var(--warn)}
.form-sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.pl-ctl{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.pl-ctl .fld{min-width:160px;flex:1;max-width:320px}
.pl-grp{margin-bottom:18px}.pl-grp h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}.pl-grp h3 small{color:var(--muted);font-weight:600}
.r-player .dorsal{position:relative;display:grid;place-items:center}
.pl-ph{width:42px;height:42px;border-radius:50%;object-fit:cover}
.pl-ph:not([hidden])+span{position:absolute;right:-6px;bottom:-4px;font-size:14px;background:var(--surface);border-radius:999px;padding:0 4px;line-height:1.3}
.pl-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.r-player{grid-template-columns:44px minmax(0,1fr)}.pl-tags{grid-column:2;justify-content:flex-start}.pl-tags:empty{display:none}}

.big-prog i.on{background:var(--big-ink)}
.big-main{overflow:auto;padding-block:clamp(16px,3.5vh,44px);display:grid;align-content:start;gap:clamp(12px,2.2vh,24px)}
.big-eyebrow{font-size:clamp(14px,1.8vw,22px);letter-spacing:.14em;text-transform:uppercase;color:var(--big-muted);font-weight:600}
.big-title{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:clamp(40px,7.5vw,112px);line-height:.95;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.big-meta{display:flex;flex-wrap:wrap;gap:10px}
.big-meta span{border:1px solid var(--big-line);border-radius:999px;padding:6px 14px;font-size:clamp(15px,2vw,24px)}
.big-desc{font-size:clamp(20px,2.8vw,38px);line-height:1.3;white-space:pre-wrap;max-width:48ch}
.big-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(16px,3vw,40px)}
.big-cols h3{margin:0 0 8px;font-size:clamp(14px,1.6vw,20px);letter-spacing:.12em;text-transform:uppercase;color:var(--big-muted)}
.big-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:clamp(18px,2.4vw,30px)}
.big-list li{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--big-line);padding-bottom:8px}
.big-list .tm{font-family:var(--f-mono);color:var(--big-muted);min-width:3.5ch}
.big-bot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border-top:1px solid var(--big-line);padding-top:14px}
.big-nav{background:var(--big-ink);color:var(--big-bg);border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:clamp(15px,1.8vw,20px);cursor:pointer}
.big-nav:disabled{opacity:.3;cursor:default}
.big-timer{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.big-time{font-family:var(--f-mono);font-size:clamp(44px,8vw,112px);font-variant-numeric:tabular-nums;line-height:1}
.big-time.done{color:var(--big-hot)}
.big-hint{color:var(--big-muted);font-size:clamp(14px,1.6vw,18px);text-align:center}
.big-tbtn{background:transparent;color:var(--big-ink);border:1px solid var(--big-line);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:clamp(14px,1.6vw,18px)}
#big :focus-visible{outline-color:var(--big-hot)}
@media (max-width:600px){.big-bot{grid-template-columns:1fr 1fr}.big-timer{grid-column:1/-1;order:-1}}

/* Bienestar y página del jugador */
.wv{display:inline-grid;place-items:center;min-width:28px;height:26px;padding:0 6px;border-radius:7px;font-family:var(--f-mono);font-size:13px;background:var(--sunk)}
.wv.lo{background:var(--warn-soft);color:var(--warn);font-weight:600}
.wv.hi{background:var(--ok-soft);color:var(--ok)}
input.flt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:14px}
.pcard{border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:14px;background:var(--bg)}
.pcard h3{margin:2px 0 0;font-family:var(--f-display);font-size:26px;text-transform:uppercase;line-height:1.05}
.pcard input,.pcard select,.pcard textarea{background:var(--surface)!important}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.seg.n10{grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
@media (max-width:480px){.seg.n10{grid-template-columns:repeat(5,minmax(0,1fr))}}
.seg label{position:relative;display:block;cursor:pointer;text-transform:none;letter-spacing:0;font-size:17px;color:var(--ink)}
.seg input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}
.seg span{display:grid;place-items:center;min-height:46px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-family:var(--f-mono);font-weight:500}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sent{margin:0;color:var(--ok);font-weight:600;text-align:center}

/* Videos e imágenes de tareas y ejercicios */
.t-img{display:block;max-width:min(100%,320px);max-height:260px;border-radius:8px;border:1px solid var(--line);margin-top:8px;background:#fff}
.vid{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-weight:600;font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.vid:hover{border-color:var(--accent)}
.imgfld{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.imgfld img{max-width:120px;max-height:90px;border-radius:6px;border:1px solid var(--line);background:#fff}
.imgfld input[type=file]{position:absolute;width:1px;height:1px;opacity:0;padding:0;border:0}
.imgfld input[type=file]:focus-visible+button,.imgfld label.filebtn:focus-within{outline:2px solid var(--accent)}
.fld label.filebtn{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);font-weight:600;cursor:pointer}
.big-body{display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,36px);align-items:flex-start}
.big-body .big-desc{flex:1 1 320px}
.big-img{max-height:42vh;max-width:min(100%,46vw);border-radius:12px;background:#fff}
@media (max-width:700px){.big-img{max-width:100%;max-height:30vh}}

/* Biblioteca de ejercicios */
.r-lib{grid-template-columns:56px minmax(0,1fr) auto}
.lib-thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#fff}
.lib-thumb.ph{display:block;background:var(--sunk);border-style:dashed}
@media (max-width:560px){.r-lib{grid-template-columns:44px minmax(0,1fr)}.lib-thumb{width:44px;height:34px}.r-lib .acts{grid-column:2/-1;justify-content:flex-start}}
.libpick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.libpick select{flex:1 1 160px;min-width:0}
.ex-block{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px;color:var(--accent);margin-top:6px}

/* Guía */
.subnav{display:flex;flex-wrap:wrap;gap:6px}
.sub{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.sub:hover{color:var(--ink);border-color:var(--muted)}
.sub.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.g-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:18px}
@media (max-width:700px){.g-cols{grid-template-columns:minmax(0,1fr)}}
.g-cols h5{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.g-cols ul{margin:0;padding-left:18px;display:grid;gap:3px}
.g-steps{margin:0;padding-left:20px;display:grid;gap:6px}
.g-kv{display:grid;gap:8px}
.g-kv>div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:14px}
.g-kv .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:2px}
@media (max-width:480px){.g-kv>div{grid-template-columns:minmax(0,1fr);gap:1px}}
.g-ctl{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.g-ctl .fld{min-width:150px}
.g-ctl select.flt{width:100%;background:var(--bg)}
.g-days{display:flex;flex-wrap:wrap;gap:4px 10px}
.fld .g-days label{display:inline-flex;align-items:center;gap:5px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500;cursor:pointer;min-height:34px}
.fld .g-days input{width:auto}
.g-table th,.g-table td{white-space:normal;vertical-align:top}
.g-table table{min-width:780px}
.g-table td.num{font-size:13px}
.g-sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.g-note{margin:0;font-size:14px;color:var(--muted)}
details.g-det{border-top:1px solid var(--line)}
.panel>details.g-det:first-child{border-top:0}
details.g-det summary{cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
details.g-det summary:hover{background:var(--sunk)}
details.g-det .in{padding:4px 16px 16px;display:grid;gap:12px}
.g-mix{display:grid;gap:14px}
.g-bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:6px 0 4px}
.g-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.g-pcts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.g-pcts>div{border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:grid;gap:2px}
.g-pcts .k{font-size:12px;color:var(--muted);font-weight:600}
details.g-det h5{margin:0}
.fld label.gm-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-top:1px solid var(--line);text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500;cursor:pointer}
.fld label.gm-row:first-child{border-top:0}
.fld label.gm-row input{width:auto}

/* Impresión / PDF */
@media print{
  :root{--bg:#fff;--surface:#fff;--sunk:#EEF1F7;--ink:#111;--muted:#555;--line:#C9CFDB;--accent:#163C84;--accent-soft:#DDE5F5;color-scheme:light;padding:0!important}
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body::before{display:none}
  #app,#gate,#modal,#toast,#big,.noprint{display:none!important}
  #doc{position:static!important;overflow:visible!important;padding:0!important;background:#fff!important}
  .doc-page{max-width:none;margin:0;border:0;border-radius:0;padding:0;gap:14px}
  .tablewrap{overflow:visible;border-radius:0}
  .ex-table{display:block!important}.ex-cards{display:none!important}
  tr{break-inside:avoid}
  .sh-sec{break-inside:avoid-page}
}
</style>
</head>
<body>

<!-- Pantallas de ingreso -->
<section class="gate" id="gate" hidden><div class="gate-card" id="gateCard"></div></section>

<!-- App -->
<div id="app" hidden>
<div class="top"><div class="wrap">
  <div class="club">
    <img class="crest" src="logo.png" alt="Escudo del club">
    <div>
      <div class="eyebrow">Cuaderno del cuerpo técnico</div>
      <h1><span id="clubName">Mi equipo</span></h1>
    </div>
  </div>
  <div class="who" id="who"></div>
</div></div>
<nav class="tabs" id="nav" aria-label="Secciones"><button class="menu-btn" type="button" data-act="menu" aria-expanded="false" aria-controls="tabs"><span id="menuCur">Resumen</span><span class="mb"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="menuLbl">Menú</span></span></button><div class="wrap" role="tablist" id="tabs"></div></nav>
<main><div class="wrap" id="view"></div></main>
</div>

<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">

</div></div>
<div id="doc" hidden><div class="doc-bar noprint" id="docBar"></div><article class="doc-page" id="docPage"></article></div>
<div id="big" hidden role="dialog" aria-label="Sesión en pantalla grande"></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js?v=15"></script>
